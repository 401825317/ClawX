name: UClaw Windows USB and macOS Production Candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version from package.json, for example 1.0.6
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: uclaw-windows-macos-production-candidates
  cancel-in-progress: false

env:
  UCLAW_NODE_VERSION: '22.19.0'
  UCLAW_RELEASE_BRANCH: feature/claw-0.5.1

jobs:
  preflight:
    name: Lock release branch identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      short_commit: ${{ steps.identity.outputs.short_commit }}
      tag: ${{ steps.identity.outputs.tag }}
      release_branch: ${{ steps.identity.outputs.release_branch }}
      plugin_version_base: ${{ steps.identity.outputs.plugin_version_base }}
    steps:
      - name: Checkout the UClaw release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.UCLAW_RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.UCLAW_NODE_VERSION }}

      - name: Require the latest clean release branch commit and matching version
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ env.UCLAW_RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a stable semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi

          git fetch --no-tags origin "$RELEASE_BRANCH"
          LOCAL_COMMIT="$(git rev-parse HEAD)"
          REMOTE_BRANCH_COMMIT="$(git rev-parse "origin/$RELEASE_BRANCH")"
          if [[ "$LOCAL_COMMIT" != "$REMOTE_BRANCH_COMMIT" ]]; then
            echo "Checked-out commit is not the latest origin/$RELEASE_BRANCH." >&2
            echo "local=$LOCAL_COMMIT remote=$REMOTE_BRANCH_COMMIT" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Release checkout is not clean." >&2
            git status --short >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match requested version ($RELEASE_VERSION)." >&2
            exit 1
          fi

          # The pull-request check is not a release gate: this workflow can be
          # dispatched directly from the release branch. Re-run the plugin
          # content/version guard against the branch's mainline merge base so a
          # manually dispatched candidate cannot package a schema/content change
          # whose package and manifest versions were left unchanged.
          git fetch --no-tags origin main
          PLUGIN_VERSION_BASE="$(git merge-base HEAD origin/main)"
          PLUGIN_VERSION_BASE="$PLUGIN_VERSION_BASE" \
            node scripts/check-plugin-version-bumps.mjs --head HEAD

          TAG="v$RELEASE_VERSION"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_TYPE="$(git cat-file -t "refs/tags/$TAG")"
            if [[ "$TAG_TYPE" != "tag" ]]; then
              echo "Existing tag $TAG is not annotated." >&2
              exit 1
            fi
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_COMMIT" != "$LOCAL_COMMIT" ]]; then
              echo "Existing tag $TAG points to $TAG_COMMIT, not $LOCAL_COMMIT." >&2
              exit 1
            fi
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$LOCAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_commit=${LOCAL_COMMIT:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "plugin_version_base=$PLUGIN_VERSION_BASE" >> "$GITHUB_OUTPUT"

  build-windows-usb:
    name: Build Windows USB candidate
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CI: 'true'
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      PLUGIN_VERSION_BASE: ${{ needs.preflight.outputs.plugin_version_base }}
    steps:
      - name: Checkout locked commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.UCLAW_NODE_VERSION }}
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false

      - name: Prefer HTTPS for public GitHub dependencies
        shell: pwsh
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Windows USB candidate
        shell: pwsh
        run: pnpm run package:win:usb

      - name: Require SignPath credential
        shell: pwsh
        env:
          SIGNPATH_TOKEN_PRESENT: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (-not $env:SIGNPATH_TOKEN_PRESENT) {
            throw 'Repository secret SIGNPATH_API_TOKEN is required for a signed Windows USB release.'
          }

      - name: Prepare unsigned Windows USB executables for SignPath
        shell: pwsh
        run: |
          $executables = @(
            'release\win-unpacked\UClaw.exe',
            'release\win-unpacked\resources\resources\updater\win32-x64\uclaw-portable-updater.exe'
          )
          $inputDirectory = 'release\signpath-input'
          Remove-Item -LiteralPath $inputDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $inputDirectory -Force | Out-Null
          foreach ($executable in $executables) {
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "USB package is missing executable: $executable"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $executable
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected an unsigned executable before SignPath: $executable ($($signature.Status))"
            }
            Copy-Item -LiteralPath $executable -Destination $inputDirectory -Force
          }
          "USB_UNSIGNED_EXE_COUNT=$($executables.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # SignPath Trusted Build requires the input artifact to exist on GitHub first.
      - name: Upload unsigned Windows USB executables for SignPath
        id: upload-unsigned-usb-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-uclaw-usb-executables-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/signpath-input/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows USB executables via SignPath
        id: signpath-sign-windows-usb
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: "78e37079-23df-4800-b41c-33312ad7c1e3"
          project-slug: "ValueCell"
          signing-policy-slug: "ValueCell-sign"
          github-artifact-id: ${{ steps.upload-unsigned-usb-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/signed-executables

      - name: Replace USB executables with signed ones
        shell: pwsh
        run: |
          $targets = @{
            'UClaw.exe' = 'release\win-unpacked\UClaw.exe'
            'uclaw-portable-updater.exe' = 'release\win-unpacked\resources\resources\updater\win32-x64\uclaw-portable-updater.exe'
          }
          $signedExeFiles = @(Get-ChildItem -Path 'release\signed-executables' -Filter *.exe -File -Recurse)
          if ($signedExeFiles.Count -ne [int]$env:USB_UNSIGNED_EXE_COUNT) {
            throw "Signed executable count ($($signedExeFiles.Count)) does not match unsigned count ($env:USB_UNSIGNED_EXE_COUNT)"
          }
          foreach ($name in $targets.Keys) {
            $matches = @($signedExeFiles | Where-Object { $_.Name -eq $name })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one signed $name; found $($matches.Count)."
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $matches[0].FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for ${name}: $($signature.Status)."
            }
            Copy-Item -LiteralPath $matches[0].FullName -Destination $targets[$name] -Force
          }
          foreach ($target in $targets.Values) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid') {
              throw "Final USB executable is not signed: $target ($($signature.Status))"
            }
          }

      - name: Rebuild signed Windows USB ZIP
        shell: pwsh
        run: node scripts/build-usb-release.mjs --win --arch=x64

      - name: Refresh integrity metadata from final ZIP
        shell: pwsh
        run: |
          node scripts/windows-support/refresh-portable-release-metadata.mjs `
            --zip "release\UClaw-$env:RELEASE_VERSION-win-x64-usb.zip" `
            --version $env:RELEASE_VERSION `
            --commit $env:RELEASE_COMMIT

      - name: Stage immutable production candidate
        shell: pwsh
        run: |
          node scripts/windows-support/stage-production-release-candidate.mjs `
            --version $env:RELEASE_VERSION `
            --commit $env:RELEASE_COMMIT

      - name: Upload immutable production candidate
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: release/production-candidate/*
          if-no-files-found: error
          retention-days: 14

  build-macos-usb:
    name: Build macOS USB candidates
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CI: 'true'
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      PLUGIN_VERSION_BASE: ${{ needs.preflight.outputs.plugin_version_base }}
    steps:
      - name: Checkout locked commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.UCLAW_NODE_VERSION }}
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false

      - name: Prefer HTTPS for public GitHub dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS runtime binaries
        run: |
          pnpm run uv:download:mac
          pnpm run agent-browser:download:mac

      - name: Build macOS x64 and arm64 USB packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          ulimit -n 65536 || true
          # package:mac:usb runs the plugin content/version guard locally too.
          # workflow_dispatch has no pull-request base SHA, so provide the
          # same mainline merge base used by preflight instead of letting the
          # guard fall back to an empty CI base and fail the build.
          git fetch --no-tags origin main
          PLUGIN_VERSION_BASE="$(git merge-base HEAD origin/main)" pnpm run package:mac:usb

      - name: Verify exact macOS USB artifacts
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            zip="release/UClaw-${RELEASE_VERSION}-mac-${arch}-usb.zip"
            test -s "$zip"
            test -s "${zip%.zip}.json"
          done

      - name: Stage immutable macOS production candidate
        run: |
          node scripts/macos-support/stage-production-release-candidate.mjs \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"

      - name: Upload immutable macOS production candidate
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-macos-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: release/macos-production-candidate/*
          if-no-files-found: error
          retention-days: 14

  candidates-ready:
    name: Confirm immutable production candidates
    needs:
      - preflight
      - build-windows-usb
      - build-macos-usb
    runs-on: ubuntu-latest
    steps:
      - name: Write candidate summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## UClaw ${{ needs.preflight.outputs.version }} candidates ready

          - Commit: `${{ needs.preflight.outputs.commit }}`
          - Windows x64 and macOS x64/arm64 USB candidates are stored as immutable Actions artifacts
          - Production OSS and UClaw staging must be run locally with the DPAPI-protected publisher
          - No production feed or GitHub Release was changed by this workflow
          EOF
