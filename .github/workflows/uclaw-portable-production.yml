name: UClaw Windows USB and macOS Production Stage

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version from package.json, for example 1.0.6
        required: true
        type: string
      mandatory:
        description: Make the portable update mandatory
        required: true
        default: false
        type: boolean
      release_notes:
        description: Public release notes; leave empty to use the default summary
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: uclaw-windows-macos-production-stage
  cancel-in-progress: false

env:
  UCLAW_NODE_VERSION: '22.19.0'

jobs:
  preflight:
    name: Lock release branch identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      short_commit: ${{ steps.identity.outputs.short_commit }}
      tag: ${{ steps.identity.outputs.tag }}
      release_branch: ${{ steps.identity.outputs.release_branch }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.UCLAW_NODE_VERSION }}

      - name: Require the latest clean release branch commit and matching version
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SELECTED_REF: ${{ github.ref }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$SELECTED_REF" != refs/heads/* ]]; then
            echo "Formal portable releases must be dispatched from a branch; selected ref: $SELECTED_REF" >&2
            exit 1
          fi
          SELECTED_BRANCH="${SELECTED_REF#refs/heads/}"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a stable semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi

          git fetch --no-tags origin "$SELECTED_BRANCH"
          LOCAL_COMMIT="$(git rev-parse HEAD)"
          REMOTE_BRANCH_COMMIT="$(git rev-parse "origin/$SELECTED_BRANCH")"
          if [[ "$LOCAL_COMMIT" != "$SELECTED_SHA" || "$LOCAL_COMMIT" != "$REMOTE_BRANCH_COMMIT" ]]; then
            echo "Selected commit is not the latest origin/$SELECTED_BRANCH." >&2
            echo "selected=$SELECTED_SHA local=$LOCAL_COMMIT remote=$REMOTE_BRANCH_COMMIT" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Release checkout is not clean." >&2
            git status --short >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match requested version ($RELEASE_VERSION)." >&2
            exit 1
          fi

          TAG="v$RELEASE_VERSION"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_TYPE="$(git cat-file -t "refs/tags/$TAG")"
            if [[ "$TAG_TYPE" != "tag" ]]; then
              echo "Existing tag $TAG is not annotated." >&2
              exit 1
            fi
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_COMMIT" != "$LOCAL_COMMIT" ]]; then
              echo "Existing tag $TAG points to $TAG_COMMIT, not $LOCAL_COMMIT." >&2
              exit 1
            fi
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$LOCAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_commit=${LOCAL_COMMIT:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_branch=$SELECTED_BRANCH" >> "$GITHUB_OUTPUT"

  build-windows-usb:
    name: Build and stage Windows USB package
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CI: 'true'
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - name: Checkout locked commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0

      - name: Parse protected Windows release scripts
        shell: pwsh
        run: |
          $scripts = @('scripts/windows-support/publish-disabled-release-stage.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $messages = $errors | ForEach-Object { $_.Message }
              throw "PowerShell parser rejected ${script}: $($messages -join '; ')"
            }
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.UCLAW_NODE_VERSION }}
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false

      - name: Prefer HTTPS for public GitHub dependencies
        shell: pwsh
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Windows USB candidate
        shell: pwsh
        run: pnpm run package:win:usb

      - name: Refresh integrity metadata from final ZIP
        shell: pwsh
        run: |
          node scripts/windows-support/refresh-portable-release-metadata.mjs `
            --zip "release\UClaw-$env:RELEASE_VERSION-win-x64-usb.zip" `
            --version $env:RELEASE_VERSION `
            --commit $env:RELEASE_COMMIT

      - name: Stage immutable production candidate
        shell: pwsh
        run: |
          node scripts/windows-support/stage-production-release-candidate.mjs `
            --version $env:RELEASE_VERSION `
            --commit $env:RELEASE_COMMIT

      - name: Upload immutable production candidate
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: release/production-candidate/*
          if-no-files-found: error
          retention-days: 14

  build-macos-usb:
    name: Build and stage macOS USB packages
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CI: 'true'
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - name: Checkout locked commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.UCLAW_NODE_VERSION }}
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false

      - name: Prefer HTTPS for public GitHub dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS runtime binaries
        run: |
          pnpm run uv:download:mac
          pnpm run agent-browser:download:mac

      - name: Build macOS x64 and arm64 USB packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          ulimit -n 65536 || true
          pnpm run package:mac:usb

      - name: Verify exact macOS USB artifacts
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            zip="release/UClaw-${RELEASE_VERSION}-mac-${arch}-usb.zip"
            test -s "$zip"
            test -s "${zip%.zip}.json"
          done

      - name: Stage immutable macOS production candidate
        run: |
          node scripts/macos-support/stage-production-release-candidate.mjs \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"

      - name: Upload immutable macOS production candidate
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-macos-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: release/macos-production-candidate/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload OSS and register disabled zz-cn releases
    needs:
      - preflight
      - build-windows-usb
      - build-macos-usb
    runs-on:
      - self-hosted
      - Windows
      - X64
      - uclaw-release
    timeout-minutes: 120
    environment:
      name: uclaw-production
      url: https://uclaw-ver.oss-cn-beijing.aliyuncs.com/releases/latest/UClaw-${{ needs.preflight.outputs.version }}-win-x64-usb.zip
    env:
      CI: 'true'
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      RELEASE_MANDATORY: ${{ inputs.mandatory }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      WINDOWS_CANDIDATE_DIRECTORY: release/production-candidate
      MACOS_CANDIDATE_DIRECTORY: release/macos-production-candidate
    steps:
      - name: Checkout locked commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          clean: true

      - name: Download exact Windows production candidate
        uses: actions/download-artifact@v4
        with:
          name: uclaw-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: ${{ env.WINDOWS_CANDIDATE_DIRECTORY }}

      - name: Download exact macOS production candidate
        uses: actions/download-artifact@v4
        with:
          name: uclaw-macos-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: ${{ env.MACOS_CANDIDATE_DIRECTORY }}

      - name: Verify protected release runner prerequisites
        shell: pwsh
        run: |
          $required = @(
            (Join-Path $env:APPDATA 'UClaw\release-credentials\oss-release.json'),
            (Join-Path $env:APPDATA 'UClaw\release-credentials\production-ssh.json'),
            (Join-Path $env:TEMP 'uclaw-ossutil\ossutil-2.3.0-windows-amd64\ossutil.exe')
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Protected release runner prerequisite is missing: $path"
            }
          }

      - name: Validate publication inputs without production writes
        shell: pwsh
        run: |
          & scripts/windows-support/publish-disabled-release-stage.ps1 `
            -WindowsCandidateDirectory $env:WINDOWS_CANDIDATE_DIRECTORY `
            -MacosCandidateDirectory $env:MACOS_CANDIDATE_DIRECTORY `
            -Version $env:RELEASE_VERSION `
            -Commit $env:RELEASE_COMMIT `
            -ValidateOnly

      - name: Upload immutable OSS objects and register disabled releases
        shell: pwsh
        run: |
          $mandatory = [bool]::Parse($env:RELEASE_MANDATORY)
          & scripts/windows-support/publish-disabled-release-stage.ps1 `
            -WindowsCandidateDirectory $env:WINDOWS_CANDIDATE_DIRECTORY `
            -MacosCandidateDirectory $env:MACOS_CANDIDATE_DIRECTORY `
            -Version $env:RELEASE_VERSION `
            -Commit $env:RELEASE_COMMIT `
            -ReleaseNotes $env:RELEASE_NOTES `
            -Mandatory $mandatory

      - name: Write disabled stage summary
        shell: pwsh
        run: |
          $candidate = Get-Content -Raw -LiteralPath (Join-Path $env:WINDOWS_CANDIDATE_DIRECTORY 'candidate.json') | ConvertFrom-Json
          $publication = Get-Content -Raw -LiteralPath (Join-Path $env:WINDOWS_CANDIDATE_DIRECTORY 'stage-publication.json') | ConvertFrom-Json
          @"
          ## UClaw $($candidate.version) staged disabled

          - Commit: ``$($candidate.commit)``
          - Build ID: ``$($candidate.buildId)``
          - Windows x64 and macOS x64/arm64 USB ZIPs uploaded to OSS
          - zz-cn records: ``$($publication.databaseRows.Count)``
          - Enabled: ``$($publication.enabled)``
          - Mandatory: ``$($publication.mandatory)``
          - Existing public feeds were verified unchanged
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload final production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WINDOWS_CANDIDATE_DIRECTORY }}/*
            ${{ env.MACOS_CANDIDATE_DIRECTORY }}/candidate.json
            ${{ env.MACOS_CANDIDATE_DIRECTORY }}/*.json
          if-no-files-found: warn
          retention-days: 30
