name: UClaw Windows USB and macOS Production Candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version from package.json, for example 1.0.6
        required: true
        type: string
      operation:
        description: Select the single production operation to run
        required: false
        default: build_candidates
        type: choice
        options:
          - build_candidates
          - verify_oss_upload
          - stage_disabled
          - stage_disabled_windows

permissions:
  actions: read
  contents: read

concurrency:
  group: uclaw-windows-macos-production-candidates
  cancel-in-progress: false

env:
  UCLAW_NODE_VERSION: '22.19.0'
  UCLAW_RELEASE_BRANCH: feature/claw-0.5.1

jobs:
  preflight:
    name: Lock release branch identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      short_commit: ${{ steps.identity.outputs.short_commit }}
      tag: ${{ steps.identity.outputs.tag }}
      release_branch: ${{ steps.identity.outputs.release_branch }}
      plugin_version_base: ${{ steps.identity.outputs.plugin_version_base }}
    steps:
      - name: Checkout the UClaw release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.UCLAW_RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.UCLAW_NODE_VERSION }}

      - name: Require the latest clean release branch commit and matching version
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ env.UCLAW_RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a stable semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi

          git fetch --no-tags origin "$RELEASE_BRANCH"
          LOCAL_COMMIT="$(git rev-parse HEAD)"
          REMOTE_BRANCH_COMMIT="$(git rev-parse "origin/$RELEASE_BRANCH")"
          if [[ "$LOCAL_COMMIT" != "$REMOTE_BRANCH_COMMIT" ]]; then
            echo "Checked-out commit is not the latest origin/$RELEASE_BRANCH." >&2
            echo "local=$LOCAL_COMMIT remote=$REMOTE_BRANCH_COMMIT" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Release checkout is not clean." >&2
            git status --short >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match requested version ($RELEASE_VERSION)." >&2
            exit 1
          fi

          # The pull-request check is not a release gate: this workflow can be
          # dispatched directly from the release branch. Re-run the plugin
          # content/version guard against the branch's mainline merge base so a
          # manually dispatched candidate cannot package a schema/content change
          # whose package and manifest versions were left unchanged.
          git fetch --no-tags origin main
          PLUGIN_VERSION_BASE="$(git merge-base HEAD origin/main)"
          PLUGIN_VERSION_BASE="$PLUGIN_VERSION_BASE" \
            node scripts/check-plugin-version-bumps.mjs --head HEAD

          TAG="v$RELEASE_VERSION"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_TYPE="$(git cat-file -t "refs/tags/$TAG")"
            if [[ "$TAG_TYPE" != "tag" ]]; then
              echo "Existing tag $TAG is not annotated." >&2
              exit 1
            fi
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_COMMIT" != "$LOCAL_COMMIT" ]]; then
              echo "Existing tag $TAG points to $TAG_COMMIT, not $LOCAL_COMMIT." >&2
              exit 1
            fi
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$LOCAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_commit=${LOCAL_COMMIT:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "plugin_version_base=$PLUGIN_VERSION_BASE" >> "$GITHUB_OUTPUT"

  build-windows-usb:
    name: Build Windows USB candidate
    needs: preflight
    if: ${{ inputs.operation != 'verify_oss_upload' }}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CI: 'true'
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      PLUGIN_VERSION_BASE: ${{ needs.preflight.outputs.plugin_version_base }}
    steps:
      - name: Checkout locked commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.UCLAW_NODE_VERSION }}
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false

      - name: Prefer HTTPS for public GitHub dependencies
        shell: pwsh
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Windows USB candidate
        shell: pwsh
        run: pnpm run package:win:usb

      - name: Refresh integrity metadata from final ZIP
        shell: pwsh
        run: |
          node scripts/windows-support/refresh-portable-release-metadata.mjs `
            --zip "release\UClaw-$env:RELEASE_VERSION-win-x64-usb.zip" `
            --version $env:RELEASE_VERSION `
            --commit $env:RELEASE_COMMIT

      - name: Stage immutable production candidate
        shell: pwsh
        run: |
          node scripts/windows-support/stage-production-release-candidate.mjs `
            --version $env:RELEASE_VERSION `
            --commit $env:RELEASE_COMMIT

      - name: Upload immutable production candidate
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: release/production-candidate/*
          if-no-files-found: error
          retention-days: 14

  build-macos-usb:
    name: Build macOS USB candidates
    needs: preflight
    if: ${{ inputs.operation != 'verify_oss_upload' }}
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CI: 'true'
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      PLUGIN_VERSION_BASE: ${{ needs.preflight.outputs.plugin_version_base }}
    steps:
      - name: Checkout locked commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.UCLAW_NODE_VERSION }}
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false

      - name: Prefer HTTPS for public GitHub dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS runtime binaries
        run: |
          pnpm run uv:download:mac
          pnpm run agent-browser:download:mac

      - name: Build macOS x64 and arm64 USB packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          ulimit -n 65536 || true
          # package:mac:usb runs the plugin content/version guard locally too.
          # workflow_dispatch has no pull-request base SHA, so provide the
          # same mainline merge base used by preflight instead of letting the
          # guard fall back to an empty CI base and fail the build.
          git fetch --no-tags origin main
          PLUGIN_VERSION_BASE="$(git merge-base HEAD origin/main)" pnpm run package:mac:usb

      - name: Verify exact macOS USB artifacts
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            zip="release/UClaw-${RELEASE_VERSION}-mac-${arch}-usb.zip"
            test -s "$zip"
            test -s "${zip%.zip}.json"
          done

      - name: Stage immutable macOS production candidate
        run: |
          node scripts/macos-support/stage-production-release-candidate.mjs \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"

      - name: Upload immutable macOS production candidate
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-macos-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: release/macos-production-candidate/*
          if-no-files-found: error
          retention-days: 14

  candidates-ready:
    name: Confirm immutable production candidates
    needs:
      - preflight
      - build-windows-usb
      - build-macos-usb
    if: ${{ inputs.operation != 'verify_oss_upload' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write candidate summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## UClaw ${{ needs.preflight.outputs.version }} candidates ready

          - Commit: `${{ needs.preflight.outputs.commit }}`
          - Windows x64 and macOS x64/arm64 USB candidates are stored as immutable Actions artifacts
          - Selected operation: `${{ inputs.operation }}`
          - A requested disabled staging run requires the protected `uclaw-disabled-stage` Environment
          - No public production feed or GitHub Release is changed by this workflow
          EOF

  verify-oss-upload:
    name: Verify isolated OSS upload
    needs: preflight
    if: ${{ inputs.operation == 'verify_oss_upload' || inputs.operation == 'stage_disabled' || inputs.operation == 'stage_disabled_windows' }}
    runs-on: windows-latest
    timeout-minutes: 15
    environment: uclaw-disabled-stage
    env:
      UCLAW_OSS_ACCESS_KEY_ID: ${{ secrets.UCLAW_OSS_ACCESS_KEY_ID }}
      UCLAW_OSS_ACCESS_KEY_SECRET: ${{ secrets.UCLAW_OSS_ACCESS_KEY_SECRET }}
    steps:
      - name: Checkout locked OSS probe
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}

      - name: Require protected OSS secrets
        shell: pwsh
        run: |
          $names = @('UCLAW_OSS_ACCESS_KEY_ID', 'UCLAW_OSS_ACCESS_KEY_SECRET')
          $missing = @($names | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) { throw "Protected Environment is missing required OSS secrets: $($missing -join ', ')." }

      - name: Download pinned OSS publisher
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ossutil-2.3.0-windows-amd64.zip'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-windows-amd64.zip' `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = '98209156987667b39fd12a0c7b940342900daef61a9306ea7f34acf17f287da2'
          if ($actual -ne $expected) { throw 'ossutil archive SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'uclaw-ossutil') -Force

      - name: Upload, verify, and remove isolated OSS probe
        shell: pwsh
        run: |
          & scripts/windows-support/test-oss-release-access.ps1 `
            -OssutilPath (Join-Path $env:RUNNER_TEMP 'uclaw-ossutil/ossutil-2.3.0-windows-amd64/ossutil.exe') `
            -RequireEnvironmentCredentials

  stage-disabled:
    name: Upload candidates and stage disabled release
    needs:
      - preflight
      - candidates-ready
      - verify-oss-upload
      - sign-windows-usb
      - sign-macos-usb
    if: ${{ inputs.operation == 'stage_disabled' }}
    runs-on: windows-latest
    timeout-minutes: 120
    environment: uclaw-disabled-stage
    env:
      UCLAW_OSS_ACCESS_KEY_ID: ${{ secrets.UCLAW_OSS_ACCESS_KEY_ID }}
      UCLAW_OSS_ACCESS_KEY_SECRET: ${{ secrets.UCLAW_OSS_ACCESS_KEY_SECRET }}
      UCLAW_PRODUCTION_SSH_HOST: ${{ secrets.UCLAW_PRODUCTION_SSH_HOST }}
      UCLAW_PRODUCTION_SSH_USER: ${{ secrets.UCLAW_PRODUCTION_SSH_USER }}
      UCLAW_PRODUCTION_SSH_PASSWORD: ${{ secrets.UCLAW_PRODUCTION_SSH_PASSWORD }}
      UCLAW_PRODUCTION_DATABASE: ${{ secrets.UCLAW_PRODUCTION_DATABASE }}
    steps:
      - name: Checkout locked publisher
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}

      - name: Download signed Windows candidate
        uses: actions/download-artifact@v5
        with:
          name: uclaw-signed-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: stage/windows-candidate

      - name: Download signed macOS candidates
        uses: actions/download-artifact@v5
        with:
          name: uclaw-signed-macos-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: stage/macos-candidate

      - name: Download pinned OSS publisher
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ossutil-2.3.0-windows-amd64.zip'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-windows-amd64.zip' `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = '98209156987667b39fd12a0c7b940342900daef61a9306ea7f34acf17f287da2'
          if ($actual -ne $expected) { throw 'ossutil archive SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'uclaw-ossutil') -Force

      - name: Require protected release secrets
        shell: pwsh
        run: |
          $names = @(
            'UCLAW_OSS_ACCESS_KEY_ID', 'UCLAW_OSS_ACCESS_KEY_SECRET',
            'UCLAW_PRODUCTION_SSH_HOST', 'UCLAW_PRODUCTION_SSH_USER',
            'UCLAW_PRODUCTION_SSH_PASSWORD', 'UCLAW_PRODUCTION_DATABASE'
          )
          $missing = @($names | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) { throw "Protected Environment is missing required release secrets: $($missing -join ', ')." }

      - name: Upload OSS objects and stage disabled zz-cn records
        shell: pwsh
        run: |
          & scripts/windows-support/publish-disabled-release-stage.ps1 `
            -WindowsCandidateDirectory 'stage/windows-candidate' `
            -MacosCandidateDirectory 'stage/macos-candidate' `
            -Version '${{ needs.preflight.outputs.version }}' `
            -Commit '${{ needs.preflight.outputs.commit }}' `
            -OssutilPath (Join-Path $env:RUNNER_TEMP 'uclaw-ossutil/ossutil-2.3.0-windows-amd64/ossutil.exe')

      - name: Upload disabled staging receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-disabled-stage-receipt-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: stage/windows-candidate/stage-publication.json
          if-no-files-found: warn
          retention-days: 90

  stage-disabled-windows:
    name: Upload signed Windows candidate and stage disabled release
    needs:
      - preflight
      - candidates-ready
      - verify-oss-upload
      - sign-windows-usb
    if: ${{ inputs.operation == 'stage_disabled_windows' }}
    runs-on: windows-latest
    timeout-minutes: 120
    environment: uclaw-disabled-stage
    env:
      UCLAW_OSS_ACCESS_KEY_ID: ${{ secrets.UCLAW_OSS_ACCESS_KEY_ID }}
      UCLAW_OSS_ACCESS_KEY_SECRET: ${{ secrets.UCLAW_OSS_ACCESS_KEY_SECRET }}
      UCLAW_PRODUCTION_SSH_HOST: ${{ secrets.UCLAW_PRODUCTION_SSH_HOST }}
      UCLAW_PRODUCTION_SSH_USER: ${{ secrets.UCLAW_PRODUCTION_SSH_USER }}
      UCLAW_PRODUCTION_SSH_PASSWORD: ${{ secrets.UCLAW_PRODUCTION_SSH_PASSWORD }}
      UCLAW_PRODUCTION_DATABASE: ${{ secrets.UCLAW_PRODUCTION_DATABASE }}
    steps:
      - name: Checkout locked publisher
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}

      - name: Download signed Windows candidate
        uses: actions/download-artifact@v5
        with:
          name: uclaw-signed-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: stage/windows-candidate

      - name: Download pinned OSS publisher
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ossutil-2.3.0-windows-amd64.zip'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-windows-amd64.zip' `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = '98209156987667b39fd12a0c7b940342900daef61a9306ea7f34acf17f287da2'
          if ($actual -ne $expected) { throw 'ossutil archive SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'uclaw-ossutil') -Force

      - name: Require protected release secrets
        shell: pwsh
        run: |
          $names = @(
            'UCLAW_OSS_ACCESS_KEY_ID', 'UCLAW_OSS_ACCESS_KEY_SECRET',
            'UCLAW_PRODUCTION_SSH_HOST', 'UCLAW_PRODUCTION_SSH_USER',
            'UCLAW_PRODUCTION_SSH_PASSWORD', 'UCLAW_PRODUCTION_DATABASE'
          )
          $missing = @($names | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) { throw "Protected Environment is missing required release secrets: $($missing -join ', ')." }

      - name: Upload OSS objects and stage disabled Windows zz-cn record
        shell: pwsh
        run: |
          & scripts/windows-support/publish-disabled-release-stage.ps1 `
            -WindowsCandidateDirectory 'stage/windows-candidate' `
            -WindowsOnly `
            -Version '${{ needs.preflight.outputs.version }}' `
            -Commit '${{ needs.preflight.outputs.commit }}' `
            -OssutilPath (Join-Path $env:RUNNER_TEMP 'uclaw-ossutil/ossutil-2.3.0-windows-amd64/ossutil.exe')

      - name: Upload disabled Windows staging receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-disabled-windows-stage-receipt-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: stage/windows-candidate/stage-publication.json
          if-no-files-found: warn
          retention-days: 90

  sign-windows-usb:
    name: Sign Windows USB candidate
    needs:
      - preflight
      - build-windows-usb
      - verify-oss-upload
    if: ${{ inputs.operation == 'stage_disabled' || inputs.operation == 'stage_disabled_windows' }}
    runs-on: windows-latest
    timeout-minutes: 120
    environment: uclaw-disabled-stage
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Checkout locked signing tools
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}

      - name: Download locked unsigned Windows candidate
        uses: actions/download-artifact@v5
        with:
          name: uclaw-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: stage/unsigned

      - name: Require protected Windows signing secret
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw 'Protected Environment is missing SIGNPATH_API_TOKEN.'
          }

      - name: Extract UClaw executables for SignPath
        id: unsigned
        shell: pwsh
        run: |
          $version = '${{ needs.preflight.outputs.version }}'
          $zip = Join-Path 'stage/unsigned' "UClaw-$version-win-x64-usb.zip"
          $payload = 'stage/windows-payload'
          Expand-Archive -LiteralPath $zip -DestinationPath $payload -Force
          $files = @(
            (Join-Path $payload 'UClaw.exe'),
            (Join-Path $payload 'resources/resources/updater/win32-x64/uclaw-portable-updater.exe')
          )
          $missing = @($files | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) { throw "Expected UClaw executables are missing: $($missing -join ', ')." }
          $files | ForEach-Object { Get-AuthenticodeSignature -FilePath $_ | ForEach-Object { if ($_.Status -ne 'NotSigned') { throw "Expected unsigned input before SignPath: $($_.Path)" } } }
          New-Item -ItemType Directory -Force -Path 'stage/signpath-input' | Out-Null
          Copy-Item -LiteralPath $files -Destination 'stage/signpath-input'
          "payload=$payload" >> $env:GITHUB_OUTPUT

      - name: Upload Windows executables for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-portable-unsigned-executables-${{ github.run_id }}-${{ github.run_attempt }}
          path: stage/signpath-input/*.exe
          retention-days: 1

      - name: Sign UClaw executables via SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '78e37079-23df-4800-b41c-33312ad7c1e3'
          project-slug: 'ValueCell'
          signing-policy-slug: 'ValueCell-sign'
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: stage/signpath-output

      - name: Rebuild signed Windows USB candidate
        shell: pwsh
        run: |
          $version = '${{ needs.preflight.outputs.version }}'
          $commit = '${{ needs.preflight.outputs.commit }}'
          $payload = '${{ steps.unsigned.outputs.payload }}'
          $signed = Get-ChildItem -Path 'stage/signpath-output' -Filter *.exe -Recurse -File
          if ($signed.Count -ne 2) { throw "SignPath returned $($signed.Count) signed executables, expected 2." }
          foreach ($file in $signed) {
            $target = Get-ChildItem -Path $payload -Filter $file.Name -Recurse -File | Select-Object -First 1
            if ($null -eq $target) { throw "Signed executable has no payload target: $($file.Name)" }
            Copy-Item -LiteralPath $file.FullName -Destination $target.FullName -Force
            $signature = Get-AuthenticodeSignature -FilePath $target.FullName
            if ($signature.Status -ne 'Valid') { throw "Authenticode validation failed for $($target.FullName): $($signature.Status)" }
          }
          $zip = Join-Path 'stage/unsigned' "UClaw-$version-win-x64-usb.zip"
          node scripts/windows-support/repack-portable-release.mjs `
            --zip $zip `
            --replace "UClaw.exe=$(Join-Path $payload 'UClaw.exe')" `
            --replace "resources/resources/updater/win32-x64/uclaw-portable-updater.exe=$(Join-Path $payload 'resources/resources/updater/win32-x64/uclaw-portable-updater.exe')"
          node scripts/windows-support/refresh-portable-release-metadata.mjs --zip $zip --version $version --commit $commit
          node scripts/windows-support/stage-production-release-candidate.mjs --release-dir stage/unsigned --output stage/signed-candidate --version $version --commit $commit

      - name: Upload signed Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-signed-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: stage/signed-candidate/*
          if-no-files-found: error
          retention-days: 14

  sign-macos-usb:
    name: Sign and notarize macOS USB candidates
    needs:
      - preflight
      - build-macos-usb
      - verify-oss-upload
    if: ${{ inputs.operation == 'stage_disabled' }}
    runs-on: macos-latest
    timeout-minutes: 180
    environment: uclaw-disabled-stage
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - name: Checkout locked source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.UCLAW_NODE_VERSION }}
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false

      - name: Require protected macOS signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then echo "Missing protected macOS signing secret: $name" >&2; exit 1; fi
          done

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS runtime binaries
        run: |
          pnpm run uv:download:mac
          pnpm run agent-browser:download:mac

      - name: Build signed and notarized macOS USB packages
        run: |
          ulimit -n 65536 || true
          git fetch --no-tags origin main
          PLUGIN_VERSION_BASE="$(git merge-base HEAD origin/main)" pnpm run package:mac:usb:signed

      - name: Verify signed macOS apps
        run: |
          set -euo pipefail
          for app in release/mac/UClaw.app release/mac-arm64/UClaw.app; do
            codesign --verify --deep --strict --verbose=4 "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done

      - name: Stage signed macOS production candidate
        run: |
          node scripts/macos-support/stage-production-release-candidate.mjs \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --output release/signed-macos-production-candidate

      - name: Upload signed macOS candidates
        uses: actions/upload-artifact@v4
        with:
          name: uclaw-signed-macos-production-candidate-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.short_commit }}
          path: release/signed-macos-production-candidate/*
          if-no-files-found: error
          retention-days: 14
