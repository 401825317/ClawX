# ClawX CI Workflow
# Runs on pull requests targeting active development and release branches.
name: Check and Build

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      # The active UClaw release branch also carries the plugin/update
      # compatibility guard. Keep it covered when release work is reviewed
      # directly against this branch.
      - feature/claw-0.5.1

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # The plugin version guard compares the PR head with its base SHA.
          # Keep the complete graph available so `git show <base>:<path>` is
          # deterministic even when the plugin was introduced earlier in the
          # feature branch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate extension bridge
        run: pnpm run ext:bridge

      - name: Run linter
        # CI must not rewrite the checkout before the plugin content/version
        # guard compares the PR diff. Use the read-only lint entrypoint.
        run: pnpm run lint:check

      - name: Check plugin content/version bumps
        env:
          PLUGIN_VERSION_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:plugin-versions

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Run production release pipeline tests
        run: pnpm run test:release:pipeline

      - name: Run harness checks
        run: pnpm run harness:ci

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-artifacts
          path: artifacts/harness
          if-no-files-found: warn
          retention-days: 7

  build:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Prefer HTTPS for public GitHub git dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Windows attachment open-with bridge
        run: pnpm exec vitest run tests/unit/attachment-open-with.test.ts tests/unit/attachment-open-with-native.test.ts

      - name: Run Windows production release pipeline tests
        run: pnpm run test:release:pipeline

      - name: Generate extension bridge
        run: pnpm run ext:bridge

      - name: Build
        run: pnpm run build:vite
